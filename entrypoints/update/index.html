<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pluma · 更新</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>更新 Pluma</h1>

    <p id="version-line" class="muted">正在读取版本…</p>

    <section>
      <p id="dir-line" class="muted">还没有指定扩展目录</p>
      <button id="pick-dir" type="button" class="secondary">选择扩展目录</button>
      <p class="hint">
        选到你当前加载的那个 Pluma 目录（里面能看到 manifest.json）。
        <br />
        不知道装在哪：打开 edge://extensions（Chrome 是 chrome://extensions），找到 Pluma，
        卡片上显示的加载路径就是它。
        <br />
        只需要选一次；以后每次更新最多再点一次「允许」。
      </p>
    </section>

    <section>
      <button id="start" type="button" disabled>立即更新</button>
      <p id="estimate" class="hint"></p>
    </section>

    <progress id="bar" value="0" max="100" hidden></progress>
    <p id="status" class="status" role="status"></p>
    <pre id="log" class="log"></pre>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
