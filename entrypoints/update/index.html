<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pluma · 更新</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>更新 Pluma</h1>

    <!-- 版本 + 体积并成一行：体积回答的是"要下载多少"，和版本号是同一个问题 -->
    <p id="version-line" class="version">正在读取版本…</p>

    <!--
      窗口里唯一的有序步骤：先选目录，才能更新。
      序号在 .n 里；✓ / ! 由 main.ts 的 renderWindow() 按状态换。
    -->
    <div id="step" class="step">
      <span id="step-n" class="n">1</span>
      <div class="step-body">
        <p id="step-t1" class="t1">选择扩展目录</p>
        <p id="step-t2" class="t2">这是 Pluma 现在被加载的那个文件夹</p>
      </div>
      <button id="pick-dir" type="button" class="step-act">选择</button>
    </div>

    <!-- 窗口里唯一的填充色块 = 唯一的下一步 -->
    <button id="start" type="button" disabled>立即更新</button>

    <progress id="bar" value="0" max="100" hidden></progress>
    <p id="status" class="status" role="status" hidden></p>

    <!-- 说明默认收起：它只在"不知道怎么找目录"时才需要 -->
    <details id="howto" class="fold">
      <summary>怎么找这个目录？</summary>
      <p>只需要选一次；以后每次更新最多再点一次「允许」。</p>
      <p>
        不知道装在哪：打开 edge://extensions（Chrome 是 chrome://extensions），找到 Pluma，
        卡片上显示的加载路径就是它。
      </p>
    </details>

    <!-- 日志默认收起：里面是"解压出 27 个条目"这类噪音；失败时由 main.ts 自动展开 -->
    <details id="logbox" class="fold">
      <summary>详情</summary>
      <pre id="log" class="log"></pre>
    </details>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
