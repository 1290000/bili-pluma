<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>需要开启 InPrivate 权限</title>
  </head>
  <body>
    <div class="wrap">
      <h1 class="title">还差一步</h1>

      <p class="lead">
        Pluma 需要一个独立的浏览器分区来登录播放账号，这样
        <strong>不会影响你主账号的登录状态</strong>
        。
      </p>

      <div class="why">
        <p class="why-title">为什么要这样？</p>
        <p class="why-body">
          B站的登录凭据只能通过 Cookie 下发，而 Cookie 在同一个浏览器里只能存一套。
          如果在普通窗口登录播放账号，你的主账号会被顶掉。 用 InPrivate 分区可以把两者彻底隔开。
        </p>
      </div>

      <p class="steps-title">请按下面两步操作：</p>
      <ol class="steps">
        <li>
          打开
          <code>edge://extensions</code>
        </li>
        <li>
          找到
          <strong>Pluma</strong>
          → 点「详细信息」→ 勾选「
          <strong>在 InPrivate 中允许</strong>
          」
        </li>
      </ol>

      <p class="footnote" id="auto-tip">设置一次即可，之后点图标会直接打开登录窗口。</p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
