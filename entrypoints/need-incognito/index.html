<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开启无痕窗口权限 · Pluma</title>
  </head>
  <body>
    <!--
      文案纪律（2026-11-12，裁决 2，见 .workbuddy-ai/plans/2026-11-12-triage-decisions.md）

      用户原话：「弹出来这个弹窗中的文字内容太过杂乱，太过多了，必须精简，精简再精简，
      让用户一眼就知道怎么做才能快速的扫码登录上账号」。

      硬指标（`tests/unit/content/need-incognito-copy.test.ts` 断言，改文案前先看它）：
        - `<details>` 外可见文本 ≤ 150 字（改前 283）
        - 动作列表（`<ol>`）只许一个，≤ 3 步
        - 技术理由只许留在 `<details>` 里**一份** —— 不再在正文重复一遍
      所以正文只许出现「要做什么」，**不许**再写"为什么必须无痕"（那句话在折叠里）。

      ⚠️ 标题不要写"还差一步"这类**承诺**：权限没开时它就是没开，
      页面上任何"马上就成"的暗示都会变成空头支票（`#page-state` 才是唯一的进度反馈）。
    -->
    <div class="wrap">
      <h1 class="title">先允许无痕窗口</h1>

      <p class="lead">播放账号要单独登录在无痕窗口里。</p>

      <!--
        状态行：由 `main.ts` 的轮询写入（见 `incognito-watch.ts`）。
        初始不可见 —— 没有任何真实状态时不许显示"正在检查"这类占位文案，
        那是把内部实现推给用户。同样：这里**只许**由真实读到的状态驱动。

        元素 id 是 `main.ts` 的契约，改名要同步改。
      -->
      <p class="page-state" id="page-state" role="status" aria-live="polite"></p>

      <ol class="steps">
        <li>
          <button type="button" class="btn-primary" id="open-ext-page">打开扩展详情页</button>
          <button type="button" class="btn-ghost" id="copy-ext-url">复制地址</button>
        </li>
        <li>
          找到
          <strong>Pluma</strong>
          ，点「详细信息」
        </li>
        <li>
          打开「
          <strong>在 InPrivate 中允许</strong>
          」
        </li>
      </ol>

      <!--
        降级路径（理论保险，实测未触发）：主按钮失败时把地址摊开给用户手动粘贴。
        这是**同一个动作**的备用做法，不是第二个动作列表 —— 所以不另起 `<ol>`。
        默认 `hidden`；显示时由 JS 把 Chrome 的开关名附上（见 `main.ts`）。

        ⚠️ 文案上**刻意不写**「Chrome 叫『在无痕模式下启用』」：v1 的浏览器名可从
        地址里的 `edge://` / `chrome://` 直接读出来，但在两个浏览器都说的代价是
        100 多字可见文本里再划掉 16 字。第 3 步已经是"打开那个开关"，名字不同不影响操作。
      -->
      <p class="hint" id="open-hint" hidden>
        按钮没反应就手动打开
        <code id="ext-url-code">chrome://extensions</code>
      </p>

      <p class="footnote">开好后这里自动关，回到网页点「扫码登录取流账号」。</p>

      <!--
        「为什么」只留这一份（裁决 2：技术理由只许在折叠里出现一次）。
        维护者与好奇用户需要它，默认收起的用户不需要它。
      -->
      <details class="why">
        <summary class="why-title">为什么必须用无痕窗口？</summary>
        <p class="why-body">
          B站 的登录凭据只通过
          <code>Set-Cookie</code>
          响应头下发，而这是浏览器禁止 JS 读取的头 —— 扩展没法「拦截」它， 只能让浏览器真正把它写进
          Cookie 库。而写入会覆盖同一份 Cookie，
          所以播放账号必须待在另一个隔离分区里，否则会把你的主账号顶掉。
        </p>
      </details>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
